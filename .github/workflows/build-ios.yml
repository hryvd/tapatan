name: Build iOS IPA (tap@tan)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - 'tapatan_app/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Build Unsigned iOS IPA on macOS
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dart & Flutter dependencies
        working-directory: tapatan_app
        run: flutter pub get

      - name: Verify static analysis
        working-directory: tapatan_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run unit & iOS config tests
        working-directory: tapatan_app
        run: flutter test

      - name: Install CocoaPods dependencies
        working-directory: tapatan_app/ios
        run: pod install --repo-update

      - name: Build iOS Release Runner.app (no-codesign)
        working-directory: tapatan_app
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into tapatan-app-ios.ipa
        working-directory: tapatan_app
        run: |
          mkdir -p build/ios/ipa_out/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa_out/Payload/Runner.app
          cd build/ios/ipa_out
          zip -qry tapatan-app-ios.ipa Payload
          ls -lh tapatan-app-ios.ipa

      - name: Upload tapatan-app-ios.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: tapatan-app-ios-ipa
          path: tapatan_app/build/ios/ipa_out/tapatan-app-ios.ipa
          if-no-files-found: error
          retention-days: 30

